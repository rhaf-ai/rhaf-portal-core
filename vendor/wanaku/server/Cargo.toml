[package]
edition = "2024"
rust-version = "1.96"
name = "wanaku-server"
version = "0.4.0-dev"
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
default-run = "wanaku-server"
readme = false
license = "Apache-2.0"

[features]
default = ["ui"]
ui = ["dep:rust-embed"]

[lib]
name = "wanaku_server"
path = "src/lib.rs"

[[bin]]
name = "wanaku-server"
path = "src/main.rs"

[[example]]
name = "wanaku-openapi"
path = "src/openapi_export.rs"

[[test]]
name = "app_assembly"
path = "tests/app_assembly.rs"

[[test]]
name = "wasm_host"
path = "tests/wasm_host.rs"

[dependencies]
serde_ignored = "0.1.14"
utoipa = "6.0"

[dependencies.async-trait]
version = "0.1.89"

[dependencies.bytes]
version = "1.12.0"

[dependencies.clap]
version = "4.6"
features = ["derive"]

[dependencies.form_urlencoded]
version = "1.2.2"

[dependencies.http]
version = "1.4.2"

[dependencies.pingora-core]
version = "0.11.0"
package = "quixotic-plecostomus-core"

[dependencies.praxis-ai-filters]
version = "0.7.0"
git = "https://github.com/praxis-proxy/ai"
rev = "28f37a91663cc87b36e27e5497ac06f1be773cc2"
default-features = false

[dependencies.praxis-core]
version = "0.7.5"
package = "praxis-proxy-core"

[dependencies.praxis-filter]
version = "0.7.5"
package = "praxis-proxy-filter"

[dependencies.praxis-protocol]
version = "0.7.5"
package = "praxis-proxy-protocol"

[dependencies.praxis-tls]
version = "0.7.5"
package = "praxis-proxy-tls"

[dependencies.rust-embed]
version = "8"
optional = true

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"
features = ["preserve_order"]

[dependencies.serde_yaml]
version = "0.10.4"
package = "yaml_serde"

[dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt",
    "rt",
    "sync",
    "time",
    "fs",
]

[dependencies.tracing]
version = "0.1.44"

[dependencies.wanaku-feature-action-policy]
git = "https://github.com/wanaku-ai/wanaku"
rev = "1a22a9e692e2f50aed56913000be3def38a7ca2c"
features = ["openapi"]

[dependencies.wanaku-feature-audit]
git = "https://github.com/wanaku-ai/wanaku"
rev = "1a22a9e692e2f50aed56913000be3def38a7ca2c"

[dependencies.wanaku-feature-evaluator]
git = "https://github.com/wanaku-ai/wanaku"
rev = "1a22a9e692e2f50aed56913000be3def38a7ca2c"
features = ["openapi"]

[dependencies.wanaku-feature-intercept]
git = "https://github.com/wanaku-ai/wanaku"
rev = "1a22a9e692e2f50aed56913000be3def38a7ca2c"

[dependencies.wanaku-feature-mcp-metadata]
git = "https://github.com/wanaku-ai/wanaku"
rev = "1a22a9e692e2f50aed56913000be3def38a7ca2c"

[dependencies.wanaku-feature-metrics]
git = "https://github.com/wanaku-ai/wanaku"
rev = "1a22a9e692e2f50aed56913000be3def38a7ca2c"

[dependencies.wanaku-feature-plugins]
git = "https://github.com/wanaku-ai/wanaku"
rev = "1a22a9e692e2f50aed56913000be3def38a7ca2c"
features = ["openapi"]

[dependencies.wanaku-feature-simulation]
git = "https://github.com/wanaku-ai/wanaku"
rev = "1a22a9e692e2f50aed56913000be3def38a7ca2c"
features = ["openapi"]

[dependencies.wanaku-feature-tool-handler]
git = "https://github.com/wanaku-ai/wanaku"
rev = "1a22a9e692e2f50aed56913000be3def38a7ca2c"
features = ["openapi"]

[dependencies.wanaku-filters]
git = "https://github.com/wanaku-ai/wanaku"
rev = "1a22a9e692e2f50aed56913000be3def38a7ca2c"

[dependencies.wanaku-infra]
git = "https://github.com/wanaku-ai/wanaku"
rev = "1a22a9e692e2f50aed56913000be3def38a7ca2c"
features = ["openapi"]

[dependencies.wanaku-types]
git = "https://github.com/wanaku-ai/wanaku"
rev = "1a22a9e692e2f50aed56913000be3def38a7ca2c"
features = ["openapi"]

[dev-dependencies]
tempfile = "3"

[dev-dependencies.bytes]
version = "1.12.0"

[target."cfg(unix)".dependencies]
tikv-jemallocator = "0.7.0"

[target."cfg(unix)".dependencies.nix]
version = "0.32.0"
features = [
    "process",
    "signal",
    "user",
]
default-features = false

[target."cfg(windows)".dependencies.openssl]
version = "0.10.81"
features = ["vendored"]

[lints.clippy]
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cloned_instead_of_copied = "warn"
cognitive_complexity = "warn"
disallowed_methods = "deny"
expect_used = "deny"
flat_map_option = "warn"
float_cmp = "warn"
fn_params_excessive_bools = "warn"
from_iter_instead_of_collect = "warn"
if_not_else = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_futures = "warn"
large_stack_frames = "warn"
macro_use_imports = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
missing_const_for_fn = "warn"
needless_pass_by_value = "warn"
panic = "deny"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
struct_excessive_bools = "warn"
too_many_arguments = "warn"
too_many_lines = "warn"
trivially_copy_pass_by_ref = "warn"
type_complexity = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
unused_self = "warn"
unwrap_used = "deny"
wildcard_imports = "warn"

[lints.rust]
unsafe_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
