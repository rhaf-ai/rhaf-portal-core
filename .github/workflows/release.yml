name: release

# Four-platform archives and Linux multi-architecture images, published by JReleaser.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example, 0.1.0)
        required: true
        type: string
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
  CONTAINER_GROUP: ${{ vars.CONTAINER_GROUP }}

jobs:
  setup:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            version="$REQUESTED_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Release version must match the checked-out tag" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${version}"

  build:
    name: Build (${{ matrix.platform }})
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            container: true
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            container: true
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-15
            platform: macos-aarch64
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.96.0'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Validate version
        shell: bash
        run: |
          server_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rhaf-portal-core") | .version')
          if [ "$server_version" != "$VERSION" ]; then
            echo "Requested version $VERSION does not match rhaf-portal-core version: $server_version" >&2
            exit 1
          fi

      - name: Test
        run: cargo test --workspace --locked --verbose

      - name: Build release binary
        run: cargo build --release --locked -p rhaf-portal-core

      - name: Package release binary
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          archive="rhaf-portal-core-${VERSION}-${PLATFORM}"
          mkdir -p "dist/$archive"
          install -m 0755 target/release/rhaf-portal-core "dist/$archive/rhaf-portal-core"
          cp LICENSE README.md "dist/$archive/"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          rm -rf "dist/$archive"

      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rhaf-portal-core-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
          if-no-files-found: error

      # A release always publishes its images, so missing registry credentials fail the build.
      - name: Login to container registry
        if: matrix.container
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push container image
        if: matrix.container
        run: cargo build-image --push --tag "${CONTAINER_REGISTRY}/${CONTAINER_GROUP}/rhaf-portal-core:${VERSION}"


  create-manifests:
    name: Publish multi-architecture container manifests
    needs: [setup, build]
    runs-on: ubuntu-latest
    env:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.96.0'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Login to container registry
        run: |
          echo "$QUAY_PASSWORD" | podman login \
            --username "$QUAY_USERNAME" --password-stdin \
            "$CONTAINER_REGISTRY"

      - name: Create and push multi-arch manifest
        run: cargo build-image-manifest --tag "${CONTAINER_REGISTRY}/${CONTAINER_GROUP}/rhaf-portal-core:${VERSION}"


  release:
    name: Release with JReleaser
    # Publish the release after its images are available.
    needs: [setup, build, create-manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      JRELEASER_PROJECT_VERSION: ${{ needs.setup.outputs.version }}
      JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
      JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      # This is the GPG passphrase; the MAVEN_ prefix is retained for historical reasons.
      JRELEASER_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          pattern: rhaf-portal-core-*
          merge-multiple: true

      - name: Run JReleaser
        uses: jreleaser/release-action@90ac653bb9c79d11179e65d81499f3f34527dcd5 # 2.5.0
        with:
          version: 1.26.0
          arguments: full-release

      - name: Upload JReleaser output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jreleaser-logs
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
          if-no-files-found: warn
