name: Integration Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  runtime:
    name: Verify MCP forwarding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.96.0'
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build Core
        run: cargo build --workspace --locked --verbose
      - name: Check out Portal tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rhaf-ai/rhaf-portal-tests
          ref: refs/heads/main
          path: portal-tests-checkout
          persist-credentials: false
      - name: Record the Portal tests revision
        id: fixture
        run: |
          revision=$(git -C portal-tests-checkout rev-parse HEAD)
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
          printf 'Portal tests revision: `%s`\n' "$revision" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Java for Portal tests
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'portal-tests-checkout/**/pom.xml'
      - name: Run Portal integration tests
        working-directory: portal-tests-checkout
        run: |
          mvn -B --no-transfer-progress verify -Pcore-integration \
            -Dcore.binary="$GITHUB_WORKSPACE/target/debug/rhaf-portal-core"
      - name: Verify the embedded runtime
        env:
          RHAF_MCP_FIXTURE_JAR: ${{ github.workspace }}/portal-tests-checkout/fixtures/test-mcp-server/target/quarkus-app/quarkus-run.jar
          RHAF_MCP_FIXTURE_REVISION: ${{ steps.fixture.outputs.revision }}
        run: cargo test --locked --test runtime_integration -- --ignored --nocapture
      - name: Upload runtime integration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-integration-evidence
          path: target/runtime-evidence
          if-no-files-found: ignore
      - name: Upload Portal integration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portal-integration-evidence
          path: |
            portal-tests-checkout/**/target/surefire-reports/
            portal-tests-checkout/portal-tests/target/failsafe-reports/
            portal-tests-checkout/portal-tests/target/core-integration/
          if-no-files-found: ignore
