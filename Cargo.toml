[workspace]
resolver = "3"
members = [".", "xtask", "crates/rhaf-api"]
default-members = [".", "crates/rhaf-api"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }

[package]
name = "rhaf-portal-core"
default-run = "rhaf-portal-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RHAF Portal Core"
repository = "https://github.com/rhaf-ai/rhaf-portal-core"
publish = false

[dependencies]
anyhow.workspace = true
async-trait = "0.1.92"
clap.workspace = true
form_urlencoded = "1"
http = "1"
percent-encoding = "2"
rhaf-api = { path = "crates/rhaf-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pingora-core = { version = "0.11.0", package = "quixotic-plecostomus-core" }
praxis-core = { version = "0.7.5", package = "praxis-proxy-core" }
praxis-protocol = { version = "0.7.5", package = "praxis-proxy-protocol" }
praxis-tls = { version = "0.7.5", package = "praxis-proxy-tls" }
serde_yaml = { package = "yaml_serde", version = "0.10.4" }
tempfile = "3"
thiserror = "2"
tracing = "0.1.44"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
# All Wanaku crates use the same pinned revision. The admin UI is disabled.
wanaku-server = { git = "https://github.com/wanaku-ai/wanaku", rev = "1a22a9e692e2f50aed56913000be3def38a7ca2c", default-features = false }
wanaku-infra = { git = "https://github.com/wanaku-ai/wanaku", rev = "1a22a9e692e2f50aed56913000be3def38a7ca2c" }
wanaku-types = { git = "https://github.com/wanaku-ai/wanaku", rev = "1a22a9e692e2f50aed56913000be3def38a7ca2c" }
wanaku-feature-audit = { git = "https://github.com/wanaku-ai/wanaku", rev = "1a22a9e692e2f50aed56913000be3def38a7ca2c" }
wanaku-feature-evaluator = { git = "https://github.com/wanaku-ai/wanaku", rev = "1a22a9e692e2f50aed56913000be3def38a7ca2c" }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
nix = { version = "0.32", default-features = false, features = ["signal", "process", "fs"] }
toml = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "deny"
unused_imports = "deny"
unused_variables = "deny"

[workspace.lints.clippy]
# Safety: prevent panicking in production code
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

# Correctness
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
float_cmp = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"

# Clarity
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
from_iter_instead_of_collect = "warn"
if_not_else = "warn"
macro_use_imports = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
missing_const_for_fn = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
too_many_lines = "warn"
trivially_copy_pass_by_ref = "warn"
unreadable_literal = "warn"
wildcard_imports = "warn"

# Complexity
cognitive_complexity = "warn"
too_many_arguments = "warn"
type_complexity = "warn"

# Async
large_futures = "warn"
large_stack_frames = "warn"

# Disallowed methods (configured in clippy.toml)
disallowed_methods = "deny"
